name: Android build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk LinkShelf-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: LinkShelf-debug-apk
          path: LinkShelf-debug.apk

      # Publishes the newest debug APK to a "dev-latest" pre-release,
      # so it can be downloaded straight from a phone browser.
      - name: Publish dev build
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete dev-latest --yes --cleanup-tag || true
          gh release create dev-latest LinkShelf-debug.apk \
            --prerelease \
            --title "Latest dev build" \
            --notes "Debug build of ${GITHUB_SHA::7}. Install on your phone to test." \
            --target "${GITHUB_SHA}"

      # Play Store bundle. Needs these repository secrets:
      # KEYSTORE_BASE64 (base64 of the .jks file), KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
      - name: Build signed release bundle
        if: env.HAS_KEYSTORE == 'true' && github.event_name != 'pull_request'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
          export KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          ./gradlew bundleRelease --stacktrace

      - name: Upload release bundle
        if: env.HAS_KEYSTORE == 'true' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: LinkShelf-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
